name: plugins

on:
  push:
  pull_request:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: The Arcade's hooks/arcade.jsx is built from its src/
        run: plugins/arcade/scripts/build.sh --check
      - name: Generated sound pack tables match their sounds/*/pack.json
        run: for s in plugins/*/scripts/packs.py; do python3 "$s" --check; done
      - name: Python tests of plugin scripts
        run: for t in plugins/*/scripts/test_*.py plugins/*/skills/*/scripts/test_*.py; do python3 -I "$t"; done
      - name: Validate the marketplace and every plugin
        run: |
          claude plugin validate .
          for p in plugins/*/; do claude plugin validate "$p"; done
      - name: Test every mod
        run: |
          for p in plugins/*/; do
            if [ -d "$p/tests" ]; then (cd "$p" && claude plugin test); fi
          done
